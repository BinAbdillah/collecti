<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang - Pueny Collections</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .cart-container{max-width:900px;margin:0 auto;padding:40px 20px;}
    .cart-empty{text-align:center;padding:60px 20px;color:#777;}
    .cart-empty .icon{font-size:60px;margin-bottom:16px;opacity:.4;}
    .cart-item{
      display:flex;align-items:center;gap:20px;flex-wrap:wrap;
      background:#1a1a1a;border:1px solid #2a2a2a;border-radius:14px;
      padding:20px;margin-bottom:14px;
    }
    .cart-item-img{
      width:80px;height:80px;background:#222;border-radius:10px;
      display:flex;align-items:center;justify-content:center;
      font-size:32px;flex-shrink:0;
    }
    .cart-item-info{flex:1;min-width:150px;}
    .cart-item-info h4{font-size:14px;font-weight:600;color:#ddd;margin-bottom:4px;}
    .cart-item-info p{font-size:12px;color:#888;}
    .cart-item-qty{display:flex;align-items:center;border:1px solid #333;border-radius:8px;overflow:hidden;}
    .cart-item-qty button{padding:8px 12px;background:#222;color:#ccc;font-size:14px;cursor:pointer;}
    .cart-item-qty button:hover{background:#333;}
    .cart-item-qty span{padding:8px 12px;font-size:13px;color:#fff;background:#1a1a1a;min-width:40px;text-align:center;}
    .cart-item-price{font-size:15px;font-weight:700;color:var(--primary);min-width:110px;text-align:right;}
    .cart-item-remove{color:#666;font-size:16px;cursor:pointer;transition:color .3s;padding:6px;}
    .cart-item-remove:hover{color:#E07A5F;}
    .cart-summary{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:14px;padding:24px;margin-top:24px;}
    .cart-summary-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px;color:#aaa;}
    .cart-summary-row.total{font-size:18px;font-weight:700;color:#fff;border-top:1px solid #333;padding-top:12px;margin-top:12px;}
    .cart-summary-row.total span:last-child{color:var(--primary);}
    .cart-actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;}
    @media(max-width:600px){.cart-item-price{min-width:auto;text-align:left;}}
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="logo">Pueny<span>Collections</span></a>
      <nav class="nav-links">
        <a href="../index.html">Home</a>
        <a href="catalog.html">Katalog</a>
        <a href="mix-match.html">Mix & Match</a>
        <a href="by-request.html">By Request</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-btn cart-badge">🛒<span class="badge-count" id="cartCount">0</span></button>
      </div>
    </div>
  </header>

  <!-- ISI KERANJANG -->
  <div class="cart-container">
    <div class="section-header">
      <h2>Keranjang<span class="dot">.</span></h2>
      <p>Periksa kembali pesananmu sebelum checkout</p>
      <div class="line"></div>
    </div>

    <!-- Item dirender otomatis oleh cart.js -->
    <div id="cartItems"></div>

    <!-- Summary -->
    <div class="cart-summary">
      <div class="cart-summary-row">
        <span id="sumCount">Subtotal (0 item)</span>
        <span id="sumSubtotal">Rp 0</span>
      </div>
      <div class="cart-summary-row">
        <span>Ongkir</span>
        <span style="color:#4CAF50;">GRATIS</span>
      </div>
      <div class="cart-summary-row total">
        <span>Total</span>
        <span id="sumTotal">Rp 0</span>
      </div>
      <div class="cart-actions">
        <a href="catalog.html" class="btn btn-outline">← Lanjut Belanja</a>
        <a href="checkout.html" class="btn btn-primary" style="flex:1;text-align:center;">Checkout →</a>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-bottom">
      <p>&copy; 2026 Pueny Collections. All rights reserved.</p>
      <p class="tagline">"Anggun, Modest dan Stylish dalam Fitrah"</p>
    </div>
  </footer>

  <!-- SCRIPTS (urutan penting!) -->
  <script src="../js/modules/dataLoader.js"></script>
  <script src="../js/modules/cart.js"></script>
</body>
</html>
