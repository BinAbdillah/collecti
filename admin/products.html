<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manajemen Produk - Pueny Admin</title>
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/admin.css">
<style>
  .admin-toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
  .admin-search{padding:10px 16px;background:#222;border:1px solid #333;border-radius:8px;color:#F5F0E8;font-size:13px;outline:none;width:240px;}
  .admin-search:focus{border-color:var(--primary);}
  .admin-select{padding:10px 14px;background:#222;border:1px solid #333;border-radius:8px;color:#F5F0E8;font-size:13px;outline:none;}
  .btn-gold{padding:10px 20px;background:var(--primary);color:#111;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
  .btn-gold:hover{background:var(--primary-light);}
  .btn-ghost{padding:6px 12px;background:transparent;border:1px solid #333;border-radius:6px;color:#999;font-size:12px;cursor:pointer;}
  .btn-ghost:hover{border-color:var(--primary);color:var(--primary);}
  .btn-ghost.danger:hover{border-color:#E07A5F;color:#E07A5F;}
  .prod-thumb{width:44px;height:44px;background:#222;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .prod-cell{display:flex;align-items:center;gap:12px;}
  .sync-note{background:rgba(201,169,110,.08);border:1px solid rgba(201,169,110,.2);border-radius:10px;padding:12px 16px;font-size:12px;color:#bbb;margin-bottom:20px;}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:2000;align-items:center;justify-content:center;}
  .modal-overlay.active{display:flex;}
  .modal{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:16px;padding:30px;width:90%;max-width:520px;max-height:85vh;overflow-y:auto;}
  .modal h3{font-size:18px;margin-bottom:20px;color:var(--primary);}
  .modal label{display:block;font-size:12px;color:#ccc;margin:12px 0 6px;}
  .modal input,.modal select{width:100%;padding:10px 14px;background:#222;border:1px solid #333;border-radius:8px;color:#F5F0E8;font-size:13px;outline:none;}
  .modal input:focus,.modal select:focus{border-color:var(--primary);}
  .modal-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-actions{display:flex;gap:10px;margin-top:24px;}
  .modal-actions button{flex:1;padding:12px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
  .modal-cancel{background:transparent;border:1px solid #333;color:#999;}
  .modal-save{background:var(--primary);border:none;color:#111;}
</style>
</head>
<body class="admin-body">
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-logo">Pueny<span>Admin</span></div>
    <nav>
      <a href="index.html">📊 Dashboard</a>
      <a href="products.html" class="active">👗 Produk</a>
      <a href="orders.html">📦 Pesanan</a>
      <a href="requests.html">📝 By Request</a>
    </nav>
    <div class="admin-user">👤 Admin Pueny</div>
  </aside>

  <main class="admin-main">
    <div class="admin-header"><h2>Manajemen Produk</h2><span id="prodCount"></span></div>

    <div class="sync-note">💡 Perubahan tersimpan di browser. Klik <strong>"⬇ Download products.json"</strong>, ganti file di folder <strong>data/</strong>, lalu deploy agar permanen.</div>

    <div class="admin-toolbar">
      <input type="text" class="admin-search" id="prodSearch" placeholder="🔍 Cari produk..." oninput="AdminProducts.render()">
      <select class="admin-select" id="prodCat" onchange="AdminProducts.render()">
        <option value="all">Semua Kategori</option>
        <option value="gamis">GAMIS</option>
        <option value="kebaya">KEBAYA</option>
        <option value="kulot">KULOT</option>
        <option value="khimar">KHIMAR</option>
      </select>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn-ghost" onclick="AdminProducts.reset()">↺ Reset ke JSON</button>
        <button class="btn-ghost" onclick="AdminProducts.exportJSON()">⬇ Download products.json</button>
        <button class="btn-gold" onclick="AdminProducts.openModal()">+ Tambah Produk</button>
      </div>
    </div>

    <div class="admin-table-section">
      <table class="admin-table">
        <thead><tr><th>Produk</th><th>Kategori</th><th>Harga</th><th>Badge</th><th>Terjual</th><th>Aksi</th></tr></thead>
        <tbody id="prodBody"></tbody>
      </table>
    </div>
  </main>
</div>

<!-- MODAL TAMBAH / EDIT -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">Tambah Produk</h3>
    <input type="hidden" id="f-id">
    <label>Nama Produk</label>
    <input type="text" id="f-name" placeholder="Contoh: Gamis Aisyah - Sage">
    <div class="modal-row">
      <div><label>Kategori</label>
        <select id="f-category">
          <option value="gamis">Gamis</option>
          <option value="kebaya">Kebaya</option>
          <option value="kulot">Kulot</option>
          <option value="khimar">Khimar</option>
        </select>
      </div>
      <div><label>Badge</label>
        <select id="f-badge">
          <option value="">Tanpa badge</option>
          <option value="new">NEW</option>
          <option value="sale">SALE</option>
          <option value="festive">IED FITRI</option>
          <option value="custom">CUSTOM</option>
        </select>
      </div>
    </div>
    <div class="modal-row">
      <div><label>Harga (Rp)</label><input type="number" id="f-price" placeholder="159000"></div>
      <div><label>Harga Coret (opsional)</label><input type="number" id="f-oldPrice" placeholder="199000"></div>
    </div>
    <div class="modal-row">
      <div><label>Ukuran (pisahkan koma)</label><input type="text" id="f-sizes" placeholder="S,M,L,XL"></div>
      <div><label>Koleksi</label>
        <select id="f-collection">
          <option value="daily">Daily</option>
          <option value="iedl-fitri">Ied Fitri</option>
          <option value="by-request">By Request</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="AdminProducts.closeModal()">Batal</button>
      <button class="modal-save" onclick="AdminProducts.save()">Simpan</button>
    </div>
  </div>
</div>

<script>
const AdminProducts = {
  list: [],

  async init() {
    try {
      const saved = localStorage.getItem('pueny_products_admin');
      if (saved) this.list = JSON.parse(saved);
      else {
        const res = await fetch('../data/products.json');
        this.list = (await res.json()).products || [];
      }
    } catch (e) { this.list = []; }
    this.render();
  },

  icon(cat) { return { gamis:'👗', kebaya:'👫', kulot:'👖', khimar:'🧕' }[cat] || '✨'; },

  render() {
    const q = (document.getElementById('prodSearch').value || '').toLowerCase();
    const cat = document.getElementById('prodCat').value;
    const items = this.list.filter(p =>
      (cat === 'all' || p.category === cat) &&
      (!q || (p.name || '').toLowerCase().includes(q))
    );
    document.getElementById('prodCount').textContent = items.length + ' produk';
    document.getElementById('prodBody').innerHTML = items.map(p => `
      <tr>
        <td><div class="prod-cell"><div class="prod-thumb">${this.icon(p.category)}</div>${p.name}</div></td>
        <td>${p.category}</td>
        <td>Rp ${(p.price || 0).toLocaleString('id-ID')}</td>
        <td>${p.badge ? p.badge.toUpperCase() : '-'}</td>
        <td>${p.sold || 0}</td>
        <td>
          <button class="btn-ghost" onclick="AdminProducts.edit(${p.id})">Edit</button>
          <button class="btn-ghost danger" onclick="AdminProducts.del(${p.id})">Hapus</button>
        </td>
      </tr>`).join('') ||
      '<tr><td colspan="6" style="text-align:center;color:#666;">Tidak ada produk.</td></tr>';
  },

  openModal() {
    document.getElementById('modalTitle').textContent = 'Tambah Produk';
    ['f-id','f-name','f-price','f-oldPrice','f-sizes'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('modalOverlay').classList.add('active');
  },

  edit(id) {
    const p = this.list.find(x => x.id === id);
    if (!p) return;
    document.getElementById('modalTitle').textContent = 'Edit Produk';
    document.getElementById('f-id').value = p.id;
    document.getElementById('f-name').value = p.name || '';
    document.getElementById('f-category').value = p.category || 'gamis';
    document.getElementById('f-badge').value = p.badge || '';
    document.getElementById('f-price').value = p.price || '';
    document.getElementById('f-oldPrice').value = p.oldPrice || '';
    document.getElementById('f-sizes').value = (p.sizes || []).join(',');
    document.getElementById('f-collection').value = p.collection || 'daily';
    document.getElementById('modalOverlay').classList.add('active');
  },

  closeModal() { document.getElementById('modalOverlay').classList.remove('active'); },

  save() {
    const idVal = document.getElementById('f-id').value;
    const name = document.getElementById('f-name').value.trim();
    const price = parseInt(document.getElementById('f-price').value) || 0;
    if (!name || !price) { alert('Nama & harga wajib diisi!'); return; }
    const data = {
      id: idVal ? parseInt(idVal) : (Math.max(0, ...this.list.map(x => x.id)) + 1),
      name,
      category: document.getElementById('f-category').value,
      price,
      oldPrice: parseInt(document.getElementById('f-oldPrice').value) || null,
      badge: document.getElementById('f-badge').value || null,
      rating: 5.0,
      sold: 0,
      sizes: (document.getElementById('f-sizes').value || 'All Size').split(',').map(s => s.trim()),
      colors: ['Custom'],
      image: '',
      collection: document.getElementById('f-collection').value
    };
    if (idVal) {
      const oid = parseInt(idVal);
      this.list = this.list.map(x => x.id === oid ? { ...x, ...data } : x);
    } else {
      this.list.push(data);
    }
    this.persist(); this.closeModal(); this.render();
  },

  del(id) {
    if (!confirm('Hapus produk ini?')) return;
    this.list = this.list.filter(x => x.id !== id);
    this.persist(); this.render();
  },

  persist() { localStorage.setItem('pueny_products_admin', JSON.stringify(this.list)); },

  reset() {
    if (!confirm('Kembali ke isi file products.json asli?')) return;
    localStorage.removeItem('pueny_products_admin');
    location.reload();
  },

  exportJSON() {
    const blob = new Blob([JSON.stringify({ products: this.list }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'products.json';
    a.click();
    URL.revokeObjectURL(a.href);
  }
};
document.addEventListener('DOMContentLoaded', () => AdminProducts.init());
</script>
</body>
</html>
