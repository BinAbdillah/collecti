<svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
  
  <!-- GAMIS - Dress panjang dengan detail jilbab -->
  <symbol id="icon-gamis" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Head/Hijab -->
      <ellipse cx="50" cy="20" rx="12" ry="14"/>
      <path d="M 38 20 Q 38 35 50 38 Q 62 35 62 20"/>
      <path d="M 42 15 Q 50 12 58 15"/>
      <!-- Body/Dress -->
      <path d="M 35 38 L 30 85 Q 30 90 35 90 L 65 90 Q 70 90 70 85 L 65 38"/>
      <!-- Sleeves -->
      <path d="M 35 38 L 20 55 L 25 58 L 38 45"/>
      <path d="M 65 38 L 80 55 L 75 58 L 62 45"/>
      <!-- Details -->
      <path d="M 50 38 L 50 90" stroke-dasharray="2,2"/>
      <path d="M 40 50 L 60 50" stroke-dasharray="2,2"/>
      <!-- Belt/Waist -->
      <path d="M 35 55 Q 50 58 65 55"/>
    </g>
  </symbol>

  <!-- KEBAYA MUSLIMAH - Kebaya dengan detail renda -->
  <symbol id="icon-kebaya" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Head -->
      <circle cx="50" cy="18" r="10"/>
      <path d="M 42 15 Q 50 12 58 15"/>
      <!-- Body/Kebaya -->
      <path d="M 38 28 L 35 70 L 65 70 L 62 28"/>
      <!-- Sleeves (3/4 length) -->
      <path d="M 38 28 L 25 45 L 28 48 L 40 35"/>
      <path d="M 62 28 L 75 45 L 72 48 L 60 35"/>
      <!-- Collar/V-neck -->
      <path d="M 45 28 L 50 35 L 55 28"/>
      <!-- Lace details -->
      <path d="M 38 40 Q 42 42 46 40" stroke-dasharray="1,1"/>
      <path d="M 54 40 Q 58 42 62 40" stroke-dasharray="1,1"/>
      <path d="M 38 50 Q 42 52 46 50" stroke-dasharray="1,1"/>
      <path d="M 54 50 Q 58 52 62 50" stroke-dasharray="1,1"/>
      <!-- Buttons -->
      <circle cx="50" cy="38" r="1.5" fill="currentColor"/>
      <circle cx="50" cy="45" r="1.5" fill="currentColor"/>
      <circle cx="50" cy="52" r="1.5" fill="currentColor"/>
      <!-- Skirt bottom -->
      <path d="M 35 70 L 30 90 L 70 90 L 65 70"/>
    </g>
  </symbol>

  <!-- KULOT - Wide pants -->
  <symbol id="icon-kulot" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Waist -->
      <path d="M 30 20 L 70 20"/>
      <path d="M 32 20 L 32 25 L 68 25 L 68 20"/>
      <!-- Left leg (wide) -->
      <path d="M 30 25 L 25 85 Q 25 90 30 90 L 48 90 Q 50 90 50 85 L 48 25"/>
      <!-- Right leg (wide) -->
      <path d="M 70 25 L 75 85 Q 75 90 70 90 L 52 90 Q 50 90 50 85 L 52 25"/>
      <!-- Center line -->
      <path d="M 50 25 L 50 85" stroke-dasharray="3,3"/>
      <!-- Pleats/folds -->
      <path d="M 35 30 L 33 85" stroke-dasharray="2,2"/>
      <path d="M 40 30 L 38 85" stroke-dasharray="2,2"/>
      <path d="M 65 30 L 67 85" stroke-dasharray="2,2"/>
      <path d="M 60 30 L 62 85" stroke-dasharray="2,2"/>
      <!-- Waistband detail -->
      <path d="M 32 22 L 68 22"/>
    </g>
  </symbol>

  <!-- KHIMAR - Hijab panjang menutup dada -->
  <symbol id="icon-khimar" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Head shape -->
      <ellipse cx="50" cy="25" rx="15" ry="18"/>
      <!-- Khimar top -->
      <path d="M 35 25 Q 35 10 50 10 Q 65 10 65 25"/>
      <!-- Khimar sides (long, covering chest) -->
      <path d="M 35 25 L 30 75 Q 30 80 35 80 L 45 80 L 45 40"/>
      <path d="M 65 25 L 70 75 Q 70 80 65 80 L 55 80 L 55 40"/>
      <!-- Face opening -->
      <ellipse cx="50" cy="28" rx="10" ry="12"/>
      <!-- Khimar bottom edge -->
      <path d="M 30 75 Q 50 78 70 75"/>
      <!-- Fold details -->
      <path d="M 40 30 L 38 75" stroke-dasharray="2,2"/>
      <path d="M 60 30 L 62 75" stroke-dasharray="2,2"/>
      <path d="M 50 10 L 50 25" stroke-dasharray="2,2"/>
    </g>
  </symbol>

  <!-- SHOPPING BAG -->
  <symbol id="icon-bag" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 25 35 L 20 90 Q 20 95 25 95 L 75 95 Q 80 95 80 90 L 75 35 Z"/>
      <path d="M 35 35 L 35 25 Q 35 15 50 15 Q 65 15 65 25 L 65 35"/>
      <path d="M 25 35 L 75 35"/>
      <!-- Handle detail -->
      <path d="M 40 25 Q 50 20 60 25"/>
    </g>
  </symbol>

  <!-- SEARCH -->
  <symbol id="icon-search" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
      <circle cx="42" cy="42" r="22"/>
      <path d="M 58 58 L 80 80"/>
    </g>
  </symbol>

  <!-- HEART/WISHLIST -->
  <symbol id="icon-heart" viewBox="0 0 100 100">
    <path d="M 50 85 L 20 55 Q 5 40 5 25 Q 5 10 20 10 Q 35 10 50 30 Q 65 10 80 10 Q 95 10 95 25 Q 95 40 80 55 Z" 
          fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
  </symbol>

  <!-- USER/ACCOUNT -->
  <symbol id="icon-user" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <circle cx="50" cy="35" r="18"/>
      <path d="M 20 90 Q 20 65 50 65 Q 80 65 80 90"/>
    </g>
  </symbol>

  <!-- MENU/HAMBURGER -->
  <symbol id="icon-menu" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round">
      <path d="M 20 30 L 80 30"/>
      <path d="M 20 50 L 80 50"/>
      <path d="M 20 70 L 80 70"/>
    </g>
  </symbol>

  <!-- STAR/RATING -->
  <symbol id="icon-star" viewBox="0 0 100 100">
    <path d="M 50 15 L 61 38 L 86 42 L 68 59 L 72 84 L 50 73 L 28 84 L 32 59 L 14 42 L 39 38 Z" 
          fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  </symbol>

  <!-- CART -->
  <symbol id="icon-cart" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 20 25 L 25 25 L 30 70 L 75 70 L 80 35 L 35 35"/>
      <circle cx="40" cy="80" r="6"/>
      <circle cx="70" cy="80" r="6"/>
    </g>
  </symbol>

  <!-- SPARKLES/FEATURE -->
  <symbol id="icon-sparkles" viewBox="0 0 100 100">
    <g fill="currentColor">
      <path d="M 50 20 L 55 40 L 75 45 L 55 50 L 50 70 L 45 50 L 25 45 L 45 40 Z"/>
      <path d="M 75 15 L 78 25 L 88 28 L 78 31 L 75 41 L 72 31 L 62 28 L 72 25 Z"/>
      <path d="M 25 60 L 27 67 L 34 69 L 27 71 L 25 78 L 23 71 L 16 69 L 23 67 Z"/>
    </g>
  </symbol>

  <!-- RULER/SIZE -->
  <symbol id="icon-ruler" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 20 80 L 80 20 L 85 25 L 25 85 Z"/>
      <path d="M 30 70 L 35 65"/>
      <path d="M 40 60 L 45 55"/>
      <path d="M 50 50 L 55 45"/>
      <path d="M 60 40 L 65 35"/>
      <path d="M 70 30 L 75 25"/>
    </g>
  </symbol>

  <!-- SHUFFLE/MIX -->
  <symbol id="icon-shuffle" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 20 30 L 50 30 L 80 70"/>
      <path d="M 70 70 L 80 70 L 80 60"/>
      <path d="M 20 70 L 50 70 L 80 30"/>
      <path d="M 70 30 L 80 30 L 80 40"/>
    </g>
  </symbol>

  <!-- MOON/ISLAMIC -->
  <symbol id="icon-moon" viewBox="0 0 100 100">
    <path d="M 60 20 Q 40 20 30 40 Q 20 60 30 80 Q 40 100 60 100 Q 50 80 50 60 Q 50 40 60 20 Z" 
          fill="currentColor" stroke="currentColor" stroke-width="2"/>
    <circle cx="70" cy="30" r="3" fill="currentColor"/>
    <circle cx="75" cy="40" r="2" fill="currentColor"/>
    <circle cx="65" cy="35" r="2.5" fill="currentColor"/>
  </symbol>

</svg>